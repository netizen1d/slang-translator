<!DOCTYPE html>
<html>
<head>
  <title>popup</title>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      font-family: system-ui, sans-serif;
      padding: 12px;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }
    #list {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }
    .row input {
      flex: 1;
      min-width: 0;
      padding: 4px 6px;
      font-size: 12px;
      box-sizing: border-box;
    }
    .row button {
      flex-shrink: 0;
      border: none;
      background: #e53935;
      color: white;
      border-radius: 4px;
      width: 22px;
      height: 22px;
      cursor: pointer;
    }
    #addRow {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    #addBtn, #saveBtn {
      width: 100%;
      padding: 6px;
      border: none;
      border-radius: 4px;
      background: #4285f4;
      color: white;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 6px;
    }
    #status {
      font-size: 11px;
      color: green;
      height: 14px;
    }
  </style>
</head>
<body>
  <h1>slang un-abbreviator</h1>
  <div id="list"></div>
  <div id="addRow">
    <input type="text" id="newSlang" placeholder="slang (e.g. ts)">
    <input type="text" id="newFull" placeholder="abbreviation">
  </div>
  <button id="addBtn">Add</button>
  <button id="saveBtn">Save Changes</button>
  <div id="status"></div>
  <script src="popup.js"></script>
  <footer>
    <a href="https://github.com/netizen1d/slang-translator" class="home-button"> check out github </a>
    <a href="https://gtriplets.com" class="home-button"> check out my site </a>
  </footer>
</body>
</html>
